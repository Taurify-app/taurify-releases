name: Republish releases as github-actions[bot]

# One-shot: delete+recreate every GitHub Release with GITHUB_TOKEN so the
# publisher becomes github-actions[bot]. Tags and asset names are preserved.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Republish all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t TAGS < <(gh release list --limit 100 --json tagName,isLatest,createdAt \
            --jq 'sort_by(.createdAt) | .[].tagName')

          echo "Found ${#TAGS[@]} releases to republish"

          for TAG in "${TAGS[@]}"; do
            echo "::group::Republish $TAG"
            WORK=$(mktemp -d)
            META="$WORK/meta.json"
            NOTES="$WORK/notes.md"
            ASSETS="$WORK/assets"
            mkdir -p "$ASSETS"

            gh release view "$TAG" --json tagName,name,body,isPrerelease,isDraft,targetCommitish \
              > "$META"

            NAME=$(jq -r '.name // .tagName' "$META")
            TARGET=$(jq -r '.targetCommitish // "main"' "$META")
            IS_PRE=$(jq -r '.isPrerelease' "$META")
            IS_DRAFT=$(jq -r '.isDraft' "$META")
            jq -r '.body // ""' "$META" > "$NOTES"

            # Download every asset before deleting the release
            mapfile -t ASSET_NAMES < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            for A in "${ASSET_NAMES[@]}"; do
              echo "Downloading $A"
              gh release download "$TAG" --pattern "$A" --dir "$ASSETS"
            done

            echo "Deleting release $TAG (keeping git tag)"
            gh release delete "$TAG" --yes

            CREATE_ARGS=( "$TAG" --title "$NAME" --notes-file "$NOTES" --target "$TARGET" )
            if [ "$IS_PRE" = "true" ]; then
              CREATE_ARGS+=( --prerelease )
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              CREATE_ARGS+=( --draft )
            fi

            echo "Creating release $TAG as github-actions[bot]"
            # Create empty release first, then upload (avoids argv length issues)
            gh release create "${CREATE_ARGS[@]}"

            shopt -s nullglob
            FILES=( "$ASSETS"/* )
            if [ "${#FILES[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${FILES[@]}" --clobber
            fi
            shopt -u nullglob

            AUTHOR=$(gh release view "$TAG" --json author --jq '.author.login')
            echo "New author for $TAG: $AUTHOR"
            if [ "$AUTHOR" != "github-actions[bot]" ]; then
              echo "::error::Expected github-actions[bot], got $AUTHOR"
              exit 1
            fi

            rm -rf "$WORK"
            echo "::endgroup::"
          done

          echo "All releases republished."
          gh release list --limit 100
